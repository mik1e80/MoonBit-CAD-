"dimension-label" text-anchor="middle">20</text><line x1="256.5" y1="469.5" x2="256.5" y2="506" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="265.5" y="492.75" class="dimension-label" >15</text><text x="68" y="604" class="panel-note" >Center-to-edge margins: 20 mm horizontal / 15 mm vertical</text></g>
<g>
