ext x="772.5" y="557" class="dimension-label" text-anchor="middle">30</text><line x1="853.6" y1="469.5" x2="853.6" y2="506" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="862.6" y="492.75" class="dimension-label" >15</text><text x="684" y="604" class="panel-note" >Center-to-edge margins: 30 mm horizontal / 15 mm vertical</text></g>
<rect x="40" y="652" width="1200" height="130" rx="18" fill="#e9eff9" stroke="#d4dfef"/>
<text x="66" y="689" class="change" >Width 120 → 160</text>
<text x="380" y="689" class="change" >Hole radius 5 → 8</text>
<text x="752" y="689" class="change" >Horizontal margin 20 → 30</text>
<text x="66" y="724" class="recovery" >20 active relations / 28 equations / 28 variables · all four hole positions follow the design relations</text>
<text x="66" y="752" class="recovery" >Conflicting widths 160 and 170: not applied; all 28 geometry values retained. Disable conflict: Satisfied.</text>
