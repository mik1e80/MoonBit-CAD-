<rect x="470" y="190" width="126" height="31" rx="15" fill="#e7f6ee"/>
<text x="533" y="211" class="success" text-anchor="middle">Satisfied / DOF 0</text>
<text x="68" y="242" class="muted" >120 × 80 mm · 4 × R5</text>
