name: MoonBit checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Check formatting
        run: moon fmt --check
      - name: Check all targets without warnings
        run: moon check --target all --deny-warn
      - name: Build
        run: moon build
      - name: Test wasm
        run: moon test
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test JavaScript
        run: moon test --target js
      - name: Test native
        run: moon test --target native
      - name: Run public API examples
        run: moon run cmd/demo
